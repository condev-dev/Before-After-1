<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Form</title>
<style>
:root{--bg:#060b09;--card:#0e1713;--line:#18261f;--muted:#7fa090;--rgb:52,211,153}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#fff;font-family:system-ui,sans-serif}
.stage{width:min(92vw,640px);container-type:inline-size;padding:7cqw}
.login,.login *{transition:all .9s cubic-bezier(.22,1,.36,1)}
.login{position:relative;overflow:hidden;width:100%;display:flex;flex-direction:column;gap:1.5cqw;padding:4cqw;background:#d4d0c8;border:1cqw outset #fff;font-family:'Times New Roman',serif;color:#000;border-radius:0}
.login h2{font-size:7cqw;font-weight:400;color:#f00;text-decoration:underline}
.login label{font-size:4cqw;color:#000}
.login input{font:4cqw 'Times New Roman',serif;padding:1cqw;background:#fff;color:#000;border:.8cqw inset #777;border-radius:0;outline:0}
.login input:first-of-type{width:70%}
.login input:last-of-type{width:92%;align-self:flex-end}
.login input:focus{outline:.5cqw dotted #f00}
.login button{align-self:center;width:34%;padding:1.2cqw;font:4cqw 'Times New Roman',serif;color:#000;background:#c0c0c0;border:.8cqw outset #fff;border-radius:0}
.login a{align-self:flex-start;font-size:3.6cqw;color:#00e;text-decoration:underline}
.login.fixed{gap:1.6cqw;padding:7cqw;background:var(--card);border:1px solid var(--line);border-radius:6cqw;font-family:var(--en);color:#fff;box-shadow:0 8cqw 16cqw -6cqw rgba(0,0,0,.6),0 0 14cqw rgba(var(--rgb),.22)}
.login.fixed h2{font-size:8.5cqw;font-weight:700;color:#fff;text-decoration:none;margin-bottom:3cqw;letter-spacing:-.03em}
.login.fixed label{font-size:3.4cqw;color:var(--muted);align-self:flex-start;margin-top:2cqw}
.login.fixed input{width:100%;align-self:stretch;font:4cqw var(--en);padding:3.6cqw 4cqw;background:rgba(0,0,0,.35);color:#fff;border:1px solid var(--line);border-radius:3.4cqw}
.login.fixed input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1cqw rgba(var(--rgb),.25)}
.login.fixed button{width:100%;margin-top:4cqw;padding:3.6cqw;font:600 4.4cqw var(--en);color:#fff;background:linear-gradient(135deg,rgb(var(--rgb)),rgba(var(--rgb),.7));border:0;border-radius:3.4cqw;box-shadow:0 3cqw 8cqw -2cqw rgba(var(--rgb),.7)}
.login.fixed a{align-self:center;margin-top:3cqw;font-size:3.4cqw;color:var(--muted);text-decoration:none}
.login.fixed button:hover,.login.fixed button.hov{transform:translateY(-.6cqw);filter:brightness(1.12)}
.login.fixed input:hover,.login.fixed input.hov{border-color:rgba(var(--rgb),.6)}
.login::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.login.fixed::after{animation:shine 1.1s .3s ease-out}
@keyframes shine{to{transform:translateX(130%)}}
.login.fixed>.fxi{transition-delay:calc(var(--i)*55ms)}
.frame.enter .fxi{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*110ms)}
</style>
</head>
<body>
<div class="stage">
  <form class="login" id="login">
    <h2 class="fxi">Login</h2>
    <label class="fxi">Email:</label>
    <input class="fxi" id="em" autocomplete="off">
    <label class="fxi">Password:</label>
    <input class="fxi" id="pw" type="password">
    <button class="fxi" id="btn" type="button">Submit</button>
    <a class="fxi">forgot password?</a>
  </form>
</div>
<script>
const login = document.getElementById('login');
const cards = document.querySelectorAll('.fxi');
const FX = {
  fix()    { login.classList.add('fixed'); },
  undo()   { login.classList.remove('fixed'); },
  toggle() { login.classList.toggle('fixed'); },
  clear()  { login.classList.remove('fixed'); login.querySelectorAll('input').forEach((i) => i.value = ''); }
};
document.getElementById('btn').addEventListener('click', FX.toggle);
addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'f' && e.target.tagName !== 'INPUT') FX.toggle(); });
</script>
</body>
</html>
